<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Ilustração esquemática de um sistema de água (provisória)">
  <!-- Ilustração provisória: substituir pela imagem aprovada de água. Não representa um sistema PW ou WFI específico. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F7F9"/>
      <stop offset="1" stop-color="#E3E7ED"/>
    </linearGradient>
    <linearGradient id="inox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9D0DA"/>
      <stop offset="0.5" stop-color="#FAFBFC"/>
      <stop offset="1" stop-color="#C9D0DA"/>
    </linearGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#40506A"/>
      <stop offset="1" stop-color="#6E7A8E"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#fundo)"/>
  <rect y="720" width="1600" height="180" fill="#C9D0DA" opacity="0.45"/>
  <!-- filtros / pré-tratamento -->
  <g stroke="#8A94A6" stroke-width="3" fill="url(#inox)">
    <rect x="150" y="420" width="90" height="300" rx="45"/>
    <rect x="270" y="420" width="90" height="300" rx="45"/>
  </g>
  <!-- módulo de tratamento -->
  <rect x="440" y="480" width="300" height="240" rx="20" fill="url(#inox)" stroke="#8A94A6" stroke-width="3"/>
  <g fill="#40506A" opacity="0.6">
    <rect x="470" y="520" width="240" height="18" rx="9"/>
    <rect x="470" y="560" width="240" height="18" rx="9"/>
    <rect x="470" y="600" width="240" height="18" rx="9"/>
  </g>
  <!-- tanque de armazenamento -->
  <rect x="860" y="260" width="240" height="460" rx="110" fill="url(#inox)" stroke="#8A94A6" stroke-width="3"/>
  <rect x="965" y="225" width="30" height="40" rx="6" fill="#8A94A6"/>
  <!-- tubulações de água -->
  <path d="M195 420 V380 H315 V420" fill="none" stroke="url(#agua)" stroke-width="16" stroke-linejoin="round"/>
  <path d="M360 600 H440" fill="none" stroke="url(#agua)" stroke-width="16"/>
  <path d="M740 600 H800 V340 H860" fill="none" stroke="url(#agua)" stroke-width="16" stroke-linejoin="round"/>
  <!-- loop de distribuição -->
  <path d="M1100 640 H1480 V300 H1160 V360" fill="none" stroke="url(#agua)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#40506A">
    <rect x="1240" y="626" width="24" height="56" rx="6"/>
    <rect x="1380" y="626" width="24" height="56" rx="6"/>
    <rect x="1466" y="460" width="28" height="24" rx="6"/>
  </g>
  <!-- gotas -->
  <g fill="#40506A" opacity="0.35">
    <path d="M1252 700 q-10 16 0 24 q10 -8 0 -24 z"/>
    <path d="M1392 700 q-10 16 0 24 q10 -8 0 -24 z"/>
  </g>
</svg>
